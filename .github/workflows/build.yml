name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgtk-3-dev libwayland-dev wayland-protocols libxkbcommon-dev
    
    - name: Build engine and sample bot
      run: make
    
    - name: Build tournament
      run: make tournament
    
    - name: Test engine
      run: ./engine ./sample_bot ./sample_bot ./sample_bot ./sample_bot ./sample_bot
    
    - name: Build viewer
      run: make viewer

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build engine and sample bot
      run: make
    
    - name: Build tournament
      run: make tournament
    
    - name: Test engine
      run: ./engine ./sample_bot ./sample_bot ./sample_bot ./sample_bot ./sample_bot
    
    - name: Build viewer
      run: make viewer

